[project]
name = "bet-analytics"
version = "0.4.0"
description = "Quantitative sports betting analytics API"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.16,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.28,<1.0",
  "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["apps*"]
exclude = ["migrations*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["apps"]

[tool.ruff.lint.per-file-ignores]
"migrations/**/*.py" = ["E501", "I001"]
"apps/api/app/services/spreadsheet_import.py" = ["E501"]
"apps/api/app/services/analises_bet_spreadsheet_import.py" = ["E501"]
"apps/api/app/services/brasileirao_backtest_import.py" = ["E501"]
"apps/api/app/services/brasileirao_existing_enrichment.py" = ["E501"]
"apps/api/app/services/brazilian_leagues_sync.py" = ["E501", "I001", "UP035"]
"apps/api/app/services/ingestion.py" = ["E501"]
"scripts/reconcile_import.py" = ["E501"]
"tests/test_full_schema.py" = ["I001"]
"tests/test_analises_bet_spreadsheet_import.py" = ["E501"]
"tests/test_brasileirao_backtest_import.py" = ["E501", "I001"]
"tests/test_brazilian_leagues_sync.py" = ["E501"]

# Pre-existing source/test debt is kept explicit and scoped by file/rule.
# BETS-5 files are intentionally not ignored and must pass the active Ruff gate.
"apps/api/app/domain/features.py" = ["I001"]
"apps/api/app/domain/history.py" = ["E501", "I001"]
"apps/api/app/domain/match_context.py" = ["I001"]
"apps/api/app/services/match_context.py" = ["E501"]
"tests/test_feature_engine_finished_at.py" = ["E501"]
"tests/test_feature_engine_integration.py" = ["E501", "I001"]
"apps/api/app/domain/poisson.py" = ["E501", "I001", "UP017", "B008"]
"apps/api/app/services/poisson_model.py" = ["E501", "I001", "UP017", "B008"]
"apps/api/app/services/poisson_snapshot.py" = ["E501", "I001", "UP017", "B008"]
"apps/api/app/services/feature_engine.py" = ["E501", "I001", "UP017", "B008"]
"apps/api/app/services/feature_snapshot.py" = ["E501", "I001", "UP017", "B008"]
"tests/test_feature_engine.py" = ["E501", "I001", "UP017", "B008"]
"tests/test_feature_snapshot.py" = ["E501", "I001", "UP017", "B008"]
"tests/test_poisson_model.py" = ["E501", "I001", "UP017", "B008"]
"tests/test_poisson_snapshot.py" = ["E501", "I001", "UP017", "B008"]
"tests/test_poisson_integration.py" = ["E501", "I001", "UP017", "B008"]
