services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bet_analytics
      POSTGRES_USER: bet_analytics
      POSTGRES_PASSWORD: bet_analytics
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bet_analytics -d bet_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://bet_analytics:bet_analytics@db:5432/bet_analytics
      SPORTMONKS_API_TOKEN: ${SPORTMONKS_API_TOKEN}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
